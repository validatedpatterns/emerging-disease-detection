---
- name: Wait for SSO StatefulSet to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: keycloak
    namespace: "{{ namespace_sso }}"
  register: sso_statefulset
  until:
    - sso_statefulset.resources | length > 0
    - sso_statefulset.resources[0].status.readyReplicas | default(0) | int >= 1
  retries: 50
  delay: 10

- name: Retrieve SSO route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: sso
    namespace: "{{ namespace_sso }}"
  register: sso_route

- name: Retrieve UI route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ sepsisdetection_ui_app_name }}"
    namespace: "{{ sepsisui_namespace }}"
  register: sepsis_ui_route
  until: sepsis_ui_route.resources | length > 0
  retries: 30
  delay: 5

- name: Get SSO admin credentials
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ namespace_sso }}"
    name: "{{ sso_admin_credentials_secret }}"
  register: sso_admin_credentials
  no_log: true

- name: Set SSO connection details
  ansible.builtin.set_fact:
    sso_admin_user: "{{ sso_admin_credentials.resources[0].data.ADMIN_USERNAME | b64decode }}"
    sso_admin_password: "{{ sso_admin_credentials.resources[0].data.ADMIN_PASSWORD | b64decode }}"
    sso_url: "https://{{ sso_route.resources[0].spec.host }}"
    sepsis_ui_route_url: "https://{{ sepsis_ui_route.resources[0].spec.host }}"
  no_log: true

- name: Get admin token
  ansible.builtin.uri:
    url: "{{ sso_url }}/auth/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ sso_admin_user }}"
      password: "{{ sso_admin_password }}"
      grant_type: password
      client_id: admin-cli
    status_code: 200
    validate_certs: false
  register: admin_token_result
  until: admin_token_result.status == 200
  retries: 15
  delay: 5
  no_log: true

- name: Set admin token
  ansible.builtin.set_fact:
    admin_token: "{{ admin_token_result.json.access_token }}"
  no_log: true

- name: Check whether realm exists
  ansible.builtin.uri:
    url: "{{ sso_url }}/auth/admin/realms/{{ sso_realm_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ admin_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: sso_realm_result
  changed_when: false
  no_log: true

- name: Create missing realm
  ansible.builtin.uri:
    url: "{{ sso_url }}/auth/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ admin_token }}"
    body: "{{ lookup('ansible.builtin.template', playbook_dir + '/sso_realm/templates/realm.json') }}"
    body_format: json
    status_code: 201
    validate_certs: false
  when: sso_realm_result.status == 404
  changed_when: true
  no_log: true

- name: Verify realm discovery endpoint
  ansible.builtin.uri:
    url: "{{ sso_url }}/auth/realms/{{ sso_realm_id }}/.well-known/openid-configuration"
    status_code: 200
    validate_certs: false
  register: sso_discovery
  until: sso_discovery.status == 200
  retries: 10
  delay: 5
  changed_when: false

- name: Get realm signing certificates
  ansible.builtin.uri:
    url: "{{ sso_url }}/auth/realms/{{ sso_realm_id }}/protocol/openid-connect/certs"
    validate_certs: false
    return_content: true
  register: sso_realm_certs
  changed_when: false

- name: Extract realm signing public key
  ansible.builtin.command: openssl x509 -pubkey -noout
  args:
    stdin: |
      -----BEGIN CERTIFICATE-----
      {{ (sso_realm_certs.json['keys'] | selectattr('kty', 'equalto', 'RSA') | selectattr('use', 'equalto', 'sig') | first).x5c[0] }}
      -----END CERTIFICATE-----
  register: sso_public_key
  changed_when: false

- name: Create client configuration
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_sso }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ sso_config_configmap }}"
      data:
        AUTH_URL: "{{ sso_url }}/auth"
        KEYCLOAK: "true"
        PUBLIC_KEY: "{{ sso_public_key.stdout_lines[1:-1] | join('') }}"
        REALM: "{{ sso_realm_id }}"
        CLIENTID: "{{ sso_client_id }}"
