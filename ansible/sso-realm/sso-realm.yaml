---
- name: Deploy SSO Realm
  hosts: localhost
  connection: local
  gather_facts: false
  run_once: true
  vars_files:
    - group_vars/all.yml
    - group_vars/tools.yml
    - sso_realm/defaults/main.yml

  tasks:
    - name: Configure SSO realm
      ansible.builtin.include_tasks: sso_realm/tasks/main.yml
