apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sso-realm-config
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sso-config"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sso-realm-config
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sso-realm-config
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ssoRealm.serviceAccountName }}
    namespace: {{ .Values.ssoRealm.serviceAccountNamespace }}
